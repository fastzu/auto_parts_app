name: Build iOS with Dynamic Island

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_ios:
    name: Build iOS IPA
    runs-on: macos-15-intel

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Flutter packages
        run: flutter pub get

      - name: Prepare iOS config
        run: flutter build ios --config-only --no-codesign

      - name: Setup Live Activity Widget Extension
        run: |
          gem install xcodeproj --no-document || true
          ruby ios/setup_live_activity.rb

      - name: Install CocoaPods
        run: |
          if [ -f "ios/Podfile" ]; then
            cd ios && pod install --repo-update
          fi

      - name: Build iOS App (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -ry AutoPartsApp-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoPartsApp-iOS
          path: build/ios/ipa/AutoPartsApp-unsigned.ipa