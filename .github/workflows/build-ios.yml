name: Build iOS with Dynamic Island

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_ios:
    name: Build iOS IPA
    runs-on: macos-15-intel

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST" ]; then
            echo "Switching to: $LATEST"
            sudo xcode-select -s "$LATEST/Contents/Developer"
          fi
          xcodebuild -version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Use CocoaPods instead of SwiftPM
        run: flutter config --no-enable-swift-package-manager

      - name: Install Flutter packages
        run: flutter pub get

      - name: Prepare iOS release config
        run: flutter build ios --release --config-only --no-codesign\
            --dart-define=SUPABASE_URL=https://api.ghayarakjo.com \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=ADMOB_IOS_BANNER=${{ secrets.ADMOB_IOS_BANNER }}

      - name: Setup Live Activity Widget Extension
        run: |
          gem install xcodeproj --no-document || true
          ruby ios/setup_live_activity.rb

      - name: Install CocoaPods
        run: |
          if [ -f "ios/Podfile" ]; then
            cd ios && pod install --repo-update
          fi

      - name: Disable Codesigning on Runner & Pods (No Developer Account)
        run: |
          ruby -rxcodeproj -e '
            ["ios/Runner.xcodeproj", "ios/Pods/Pods.xcodeproj"].each do |path|
              next unless File.exist?(path)
              proj = Xcodeproj::Project.open(path)
              proj.targets.each do |t|
                t.build_configurations.each do |c|
                  c.build_settings["CODE_SIGN_STYLE"] = "Manual"
                  c.build_settings["CODE_SIGNING_ALLOWED"] = "NO"
                  c.build_settings["CODE_SIGNING_REQUIRED"] = "NO"
                  c.build_settings["CODE_SIGN_IDENTITY"] = ""
                  c.build_settings["EXPANDED_CODE_SIGN_IDENTITY"] = ""
                  c.build_settings["DEVELOPMENT_TEAM"] = ""
                  c.build_settings["PROVISIONING_PROFILE_SPECIFIER"] = ""
                end
              end
              if proj.root_object.attributes["TargetAttributes"]
                proj.root_object.attributes["TargetAttributes"].each_value do |attrs|
                  attrs["ProvisioningStyle"] = "Manual"
                  attrs.delete("DevelopmentTeam")
                end
              end
              proj.save
              puts "Disabled codesigning in #{path}"
            end
          '

      - name: Build iOS App (Unsigned - No Account Needed)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      - name: Package IPA
        run: |
          APP_PATH="build/ios/DerivedData/Build/Products/Release-iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Runner.app not found at $APP_PATH"
            exit 1
          fi
          mkdir -p build/ios/ipa/Payload
          cp -R "$APP_PATH" build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -ry AutoPartsApp-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoPartsApp-iOS
          path: build/ios/ipa/AutoPartsApp-unsigned.ipa